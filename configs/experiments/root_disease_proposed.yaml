# Image columns require a verified frozen checkpoint or an encoder fit inside each outer fold.
study: root_disease
name: root_disease_proposed
model: proposed
split: leave_one_cycle_out
input_file: data/interim/features_with_image_embeddings.parquet
embedding_manifest: data/interim/features_with_image_embeddings.json
features:
  image: ["image_*"]
  spectral: [m660, m710, r_680, r_705, a_660, a_710, a_940, a_970]
  positional: [pos_m710_age]
  water: [w970]
  thermal: [thermal_dt, thermal_cwsi, thermal_spread, vpd_kpa]
  temporal: [m660_delta, m660_slope]
seeds: [17, 29, 43, 59, 71]
outer_folds: 5
inner_folds: 3
search_trials: 8
synthetic: false
