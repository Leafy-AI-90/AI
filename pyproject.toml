[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "leafy-ai"
version = "0.1.0"
description = "RGB, spectral, transmission and thermal plant stress research code for Choy Sum"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "Leafy AI contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy==2.2.6",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "xgboost==3.1.1",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "pandera==0.34.1",
  "pyarrow>=17",
  "optuna==4.5.0",
]

[project.optional-dependencies]
# Install CPU PyTorch first from https://download.pytorch.org/whl/cpu to avoid CUDA wheels.
vision = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "timm==1.0.22",
  "pillow>=10",
  "grad-cam==1.5.5",
]
image = [
  "pillow>=10",
  "colour-science==0.4.7",
  "colour-checker-detection==0.2.3",  # brings OpenCV and OpenImageIO
]
stats = ["statsmodels==0.14.5", "shap==0.49.1", "matplotlib>=3.8"]
# Phase 9 adds ONNX, TensorFlow Lite and Core ML converters here.
export = []
dev = ["pytest>=8,<10", "pytest-cov>=5", "ruff==0.14.3", "pre-commit>=4"]
all = ["leafy-ai[vision,image,stats,export,dev]"]

[project.urls]
Repository = "https://github.com/Leafy-AI-90/AI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["leafy_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Formatter owns line length; long strings and URLs stay intact.
ignore = ["E501"]
