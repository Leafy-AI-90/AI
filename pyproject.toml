[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "leafy-ai"
version = "0.1.0"
description = "RGB and spectral plant stress model foundations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.9.1", "torchvision==0.24.1", "numpy==2.2.6",
  "scikit-learn==1.7.2", "xgboost==3.1.1", "pandas>=2.2,<3",
  "scipy==1.16.3", "pillow>=10", "timm==1.0.22",
  "statsmodels==0.14.5", "shap==0.49.1", "grad-cam==1.5.5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
